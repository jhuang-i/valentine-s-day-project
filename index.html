
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine's Quest 🌙💗</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100dvh;
    background: linear-gradient(#17132f, #49346e, #8b65a5);
    color: #ffe4f1;
    font-family: 'Press Start 2P', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 18px;
}

#stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #ffe4a8;
    box-shadow: 0 0 8px #fff0bb;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
}

.game {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 750px;
    padding: 22px 16px;
    border: 4px solid #ff8fb9;
    background: rgba(23, 19, 47, 0.95);
    box-shadow: 8px 8px 0 #a989db;
}

h1 {
    color: #ff9bc5;
    font-size: clamp(13px, 3vw, 20px);
    line-height: 2;
}

p {
    font-size: 10px;
    line-height: 2.4;
}

.moon {
    font-size: 55px;
    color: #ffe4a8;
    filter: drop-shadow(0 0 15px #ffe4a8);
    animation: float 3s infinite;
}

@keyframes float {
    50% { transform: translateY(-8px); }
}

.cat-scene {
    position: relative;
    height: 170px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 25px;
    border-bottom: 12px solid #554071;
    margin: 20px auto;
}

.cat {
    position: relative;
    width: 85px;
    height: 105px;
    animation: breathe 2s infinite alternate;
}

@keyframes breathe {
    to { transform: translateY(-4px); }
}

.cat-body {
    position: absolute;
    bottom: 0;
    left: 12px;
    width: 62px;
    height: 65px;
    background: var(--fur);
    border: 4px solid #292039;
    border-radius: 8px;
}

.cat-head {
    position: absolute;
    top: 0;
    left: 2px;
    width: 82px;
    height: 65px;
    background: var(--fur);
    border: 4px solid #292039;
    border-radius: 5px;
    z-index: 2;
}

.ear {
    position: absolute;
    top: -19px;
    width: 25px;
    height: 25px;
    background: var(--fur);
    border: 4px solid #292039;
}

.ear.left { left: 5px; }
.ear.right { right: 5px; }

.eye {
    position: absolute;
    top: 27px;
    width: 7px;
    height: 9px;
    background: #292039;
}

.eye.left { left: 19px; }
.eye.right { right: 19px; }

.nose {
    position: absolute;
    top: 39px;
    left: 34px;
    width: 8px;
    height: 5px;
    background: #ff8fb9;
}

.cheek {
    position: absolute;
    top: 40px;
    width: 13px;
    height: 6px;
    background: #ff9bc5;
}

.cheek.left { left: 8px; }
.cheek.right { right: 8px; }

.tail {
    position: absolute;
    bottom: 9px;
    right: -13px;
    width: 25px;
    height: 45px;
    border: 10px solid var(--fur);
    border-left: none;
    border-radius: 0 25px 25px 0;
    animation: wag 2s infinite alternate;
}

@keyframes wag {
    to { transform: rotate(12deg); }
}

.cat.pink { --fur: #f7afc9; }
.cat.cream { --fur: #ffe2ae; }

.love-heart {
    position: absolute;
    top: 0;
    font-size: 35px;
    color: #ff8fb9;
    animation: float 2s infinite;
}

.dialogue {
    border: 3px solid #a989db;
    background: #292044;
    padding: 18px 12px;
    min-height: 90px;
    margin: 20px 0;
}

button {
    font-family: inherit;
    font-size: 10px;
    padding: 14px 17px;
    margin: 6px;
    cursor: pointer;
    color: white;
    background: #e76c9e;
    border: 3px solid #ffb6d2;
    box-shadow: 4px 4px 0 #7b426e;
}

button:hover { background: #ff8fb9; }

.hidden { display: none !important; }

/* Adventure */

.hud {
    display: flex;
    justify-content: space-between;
    color: #ffb6d2;
    font-size: 10px;
    margin: 15px 0;
}

#world {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 10;
    border: 4px solid #a989db;
    background: #39325b;
    image-rendering: pixelated;
}

.controls {
    display: grid;
    grid-template-columns: repeat(3, 55px);
    justify-content: center;
    gap: 5px;
    margin: 15px auto;
}

.controls button {
    height: 50px;
    margin: 0;
    padding: 0;
    touch-action: none;
}

.empty { visibility: hidden; }

#message { white-space: pre-line; }

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<main class="game">

<h1>♡ VALENTINE'S QUEST ♡</h1>

<!-- Welcome screen -->
<section id="welcome">

    <div class="moon">☾</div>

    <div class="cat-scene">
        <div class="cat pink">
            <div class="tail"></div>
            <div class="cat-body"></div>
            <div class="cat-head">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="nose"></div>
                <div class="cheek left"></div>
                <div class="cheek right"></div>
            </div>
        </div>

        <div class="love-heart">♡</div>

        <div class="cat cream">
            <div class="tail"></div>
            <div class="cat-body"></div>
            <div class="cat-head">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="nose"></div>
                <div class="cheek left"></div>
                <div class="cheek right"></div>
            </div>
        </div>
    </div>

    <div class="dialogue">
        <p>Somewhere among a million stars...<br>
        I found someone special. ♡</p>
    </div>

    <button onclick="startQuest()">START QUEST ▶</button>
</section>

<!-- Adventure screen -->
<section id="adventure" class="hidden">

    <div class="hud">
        <span>MOONLIT MEADOW</span>
        <span>💗 <span id="score">0</span> / 5</span>
    </div>

    <canvas id="world" width="640" height="400"></canvas>

    <div class="dialogue">
        <p id="adventureMessage">
            Collect five hearts beneath the stars... ♡
        </p>
    </div>

    <div class="controls">
        <span class="empty"></span>
        <button data-dir="up">▲</button>
        <span class="empty"></span>

        <button data-dir="left">◀</button>
        <button data-dir="down">▼</button>
        <button data-dir="right">▶</button>
    </div>

    <p>Use WASD, arrow keys, or the buttons!</p>
</section>

<!-- Valentine's ending -->
<section id="ending" class="hidden">

    <div class="moon">☾</div>

    <div class="cat-scene">
        <div class="cat pink">
            <div class="tail"></div>
            <div class="cat-body"></div>
            <div class="cat-head">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="nose"></div>
                <div class="cheek left"></div>
                <div class="cheek right"></div>
            </div>
        </div>

        <div class="love-heart">♡</div>

        <div class="cat cream">
            <div class="tail"></div>
            <div class="cat-body"></div>
            <div class="cat-head">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="nose"></div>
                <div class="cheek left"></div>
                <div class="cheek right"></div>
            </div>
        </div>
    </div>

    <div class="dialogue">
        <p id="message">
            Will you be my Valentine? ♡
        </p>
    </div>

    <div id="questionButtons">
        <button onclick="sayYes()">YES ♡</button>
        <button onclick="sayNo()">NO :(</button>
    </div>

    <div id="rewardButtons" class="hidden">
        <button onclick="openLetter()">OPEN LETTER 💌</button>
    </div>

    <div id="restartButtons" class="hidden">
        <button onclick="restart()">PLAY AGAIN ↻</button>
    </div>

</section>

</main>

<script>
// Stars
const stars = document.getElementById("stars");

for (let i = 0; i < 85; i++) {
    const star = document.createElement("div");
    star.className = "star";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 3 + "s";
    stars.appendChild(star);
}

// Game setup
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

const message = document.getElementById("message");
const adventureMessage = document.getElementById("adventureMessage");

let player = { x: 60, y: 310 };
let hearts = [];
let score = 0;
let playing = false;
let noCount = 0;
let lastTime = 0;

const keys = new Set();

const heartPositions = [
    [110, 90],
    [260, 130],
    [420, 80],
    [190, 290],
    [480, 310]
];

const otherCat = { x: 570, y: 110 };

const heartMessages = [
    "One little heart, one little wish... ♡",
    "Every path feels brighter with you in it. ✨",
    "Even the moon is cheering for you. ☾",
    "Some constellations are made of moments. 💗",
    "All five hearts! Find the other kitty! 🐈"
];

function startQuest() {
    document.getElementById("welcome").classList.add("hidden");
    document.getElementById("ending").classList.add("hidden");
    document.getElementById("adventure").classList.remove("hidden");

    player = { x: 60, y: 310 };
    score = 0;
    playing = true;
    keys.clear();

    hearts = heartPositions.map(function(pos) {
        return {
            x: pos[0],
            y: pos[1],
            collected: false
        };
    });

    document.getElementById("score").textContent = "0";
    adventureMessage.textContent =
        "Collect five hearts beneath the stars... ♡";
}

function drawCat(x, y, fur) {
    ctx.fillStyle = "#292039";
    ctx.fillRect(x - 17, y - 25, 34, 30);

    ctx.fillStyle = fur;
    ctx.fillRect(x - 14, y - 22, 28, 24);

    // Ears
    ctx.fillRect(x - 13, y - 30, 9, 10);
    ctx.fillRect(x + 4, y - 30, 9, 10);

    // Eyes
    ctx.fillStyle = "#292039";
    ctx.fillRect(x - 8, y - 14, 4, 6);
    ctx.fillRect(x + 5, y - 14, 4, 6);

    // Nose
    ctx.fillStyle = "#ff8fb9";
    ctx.fillRect(x - 2, y - 8, 4, 3);

    // Body
    ctx.fillStyle = fur;
    ctx.fillRect(x - 10, y + 5, 20, 12);
}

function drawHeart(x, y) {
    ctx.fillStyle = "#ff9bc5";

    ctx.fillRect(x - 12, y - 8, 9, 9);
    ctx.fillRect(x + 3, y - 8, 9, 9);
    ctx.fillRect(x - 15, y, 30, 10);
    ctx.fillRect(x - 10, y + 10, 20, 6);
    ctx.fillRect(x - 5, y + 16, 10, 5);
}

function drawWorld() {
    ctx.fillStyle = "#39325b";
    ctx.fillRect(0, 0, 640, 400);

    // Moonlit path
    ctx.fillStyle = "#55416c";
    ctx.fillRect(30, 280, 550, 50);
    ctx.fillRect(450, 90, 70, 240);

    // Decorative flowers
    for (let i = 0; i < 35; i++) {
        const x = (i * 173 + 29) % 600 + 20;
        const y = (i * 97 + 37) % 350 + 25;

        ctx.fillStyle = "#a989db";
        ctx.fillRect(x, y, 5, 5);

        ctx.fillStyle = "#ff9bc5";
        ctx.fillRect(x + 4, y + 2, 3, 3);
    }

    // Trees
    const trees = [
        [35, 35], [194, 36], [340, 34],
        [545, 58], [70, 203], [338, 315]
    ];

    trees.forEach(function(tree) {
        ctx.fillStyle = "#38253f";
        ctx.fillRect(tree[0] - 5, tree[1], 10, 30);

        ctx.fillStyle = "#554477";
        ctx.fillRect(tree[0] - 20, tree[1] - 20, 40, 30);
    });

    // Hearts
    hearts.forEach(function(heart) {
        if (!heart.collected) {
            drawHeart(heart.x, heart.y);
        }
    });

    // Second cat
    drawCat(otherCat.x, otherCat.y, "#ffe2ae");

    // Player cat
    drawCat(player.x, player.y, "#f7afc9");
}

function distance(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
}

function update(dt) {
    if (!playing) return;

    let dx = 0;
    let dy = 0;

    if (keys.has("left")) dx--;
    if (keys.has("right")) dx++;
    if (keys.has("up")) dy--;
    if (keys.has("down")) dy++;

    const length = Math.hypot(dx, dy);

    if (length > 0) {
        const speed = 155;

        player.x += (dx / length) * speed * dt;
        player.y += (dy / length) * speed * dt;
    }

    player.x = Math.max(17, Math.min(623, player.x));
    player.y = Math.max(30, Math.min(383, player.y));

    hearts.forEach(function(heart) {
        if (!heart.collected && distance(player, heart) < 29) {
            heart.collected = true;
            score++;

            document.getElementById("score").textContent = score;
            adventureMessage.textContent = heartMessages[score - 1];
        }
    });

    if (score === 5 && distance(player, otherCat) < 43) {
        finishAdventure();
    }
}

function finishAdventure() {
    playing = false;
    keys.clear();

    document.getElementById("adventure").classList.add("hidden");
    document.getElementById("ending").classList.remove("hidden");

    message.textContent =
        "You found your way to me beneath a million stars... ♡ " +
        "Will you be my Valentine?";
}

function gameLoop(timestamp) {
    const dt = Math.min((timestamp - lastTime) / 1000 || 0, 0.04);
    lastTime = timestamp;

    update(dt);

    if (playing) {
        drawWorld();
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

// Keyboard controls
const keyMap = {
    arrowup: "up",
    w: "up",
    arrowdown: "down",
    s: "down",
    arrowleft: "left",
    a: "left",
    arrowright: "right",
    d: "right"
};

document.addEventListener("keydown", function(event) {
    if (!playing) return;

    const direction = keyMap[event.key.toLowerCase()];

    if (direction) {
        event.preventDefault();
        keys.add(direction);
    }
});

document.addEventListener("keyup", function(event) {
    const direction = keyMap[event.key.toLowerCase()];

    if (direction) {
        keys.delete(direction);
    }
});

window.addEventListener("blur", function() {
    keys.clear();
});

// Mobile controls
document.querySelectorAll("[data-dir]").forEach(function(button) {
    const direction = button.dataset.dir;

    button.addEventListener("pointerdown", function(event) {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        keys.add(direction);
    });

    button.addEventListener("pointerup", function() {
        keys.delete(direction);
    });

    button.addEventListener("pointercancel", function() {
        keys.delete(direction);
    });
});

// Valentine's question
function sayNo() {
    const responses = [
        "Are you sureeee? 🥺",
        "Even for a little pixel kitty? 🐱",
        "I'll give you all the stars! ✨",
        "Pretty please? ♡",
        "My little pixel heart is breaking 💔"
    ];

    message.textContent = responses[noCount % responses.length];
    noCount++;
}

function sayYes() {
    message.textContent =
        "QUEST COMPLETE! ♡ You made my little heart so happy!";

    document.getElementById("questionButtons").classList.add("hidden");
    document.getElementById("rewardButtons").classList.remove("hidden");

    for (let i = 0; i < 25; i++) {
        setTimeout(function() {
            const heart = document.createElement("div");
            heart.className = "star";
            heart.textContent = "💗";
            heart.style.background = "transparent";
            heart.style.fontSize = "20px";
            heart.style.left = Math.random() * 100 + "%";
            heart.style.top = Math.random() * 100 + "%";

            stars.appendChild(heart);

            setTimeout(function() {
                heart.remove();
            }, 4000);
        }, i * 100);
    }
}

function openLetter() {
    message.textContent =
        "Among countless stars, I'm grateful our paths crossed. " +
        "Every little moment with you feels like its own constellation. " +
        "Happy Valentine's Day! ♡";

    document.getElementById("rewardButtons").classList.add("hidden");
    document.getElementById("restartButtons").classList.remove("hidden");
}

function restart() {
    noCount = 0;

    document.getElementById("ending").classList.add("hidden");
    document.getElementById("welcome").classList.remove("hidden");

    document.getElementById("questionButtons").classList.remove("hidden");
    document.getElementById("rewardButtons").classList.add("hidden");
    document.getElementById("restartButtons").classList.add("hidden");
}
</script>

</body>
</html>
